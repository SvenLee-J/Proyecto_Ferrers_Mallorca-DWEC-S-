<!-- contenedor principal -->
<div class="users-container">
  
  <!-- header con titulo y boton volver -->
  <div class="users-header">
    <h2>gestión de usuarios (admin)</h2>
    <a routerlink="/home" class="btn btn-back">← volver home</a>
  </div>

  <!-- spinner de carga -->
  <div *ngif="loading" class="loading-spinner">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">cargando...</span>
    </div>
    <p>cargando usuarios...</p>
  </div>

  <!-- error mensaje -->
  <div *ngif="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- estado vacio -->
  <div *ngif="!loading && !error && users.length === 0" class="empty-state">
    <p>no hay usuarios registrados</p>
  </div>

  <!-- tabla usuarios -->
  <div *ngif="!loading && users.length > 0" class="users-table-container">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>id</th>
          <th>nombre</th>
          <th>email</th>
          <th>rol</th>
          <th>acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- fila por cada usuario -->
        <tr *ngfor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>
            <!-- badge por rol -->
            <span class="role-badge" [class]="user.role === 'admin' ? 'admin' : 'client'">
              {{ user.role }}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-edit me-2">editar</button>
            <button class="btn btn-sm btn-delete">eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
